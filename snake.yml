name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: krishkhinchi
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=%232d3343,%23113a34,%230d5c4f,%2310B981,%2322D3EE
            dist/snake-light.svg?palette=github-light&color_snake=%230891B2&color_dots=%23e7ecf7,%23bfe9e0,%237fd6c0,%2310B981,%230891B2

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
